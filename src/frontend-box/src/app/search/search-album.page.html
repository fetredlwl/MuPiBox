<!-- (the header of the start page's album list: every theme draws it the same) -->
<ion-header class="medialist-header search-album-header" [class.km-r2]="r2()">
  @if (r2()) {
    <div class="km-bar">
      <button class="km-hbtn" type="button" data-mupi-back (click)="goBack()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
      </button>
      <div class="km-htitle"><span class="km-ht1">{{ title() }}</span></div>
      <mupi-km-status-group></mupi-km-status-group>
    </div>
  } @else {
    <ion-toolbar color="light">
      <ion-buttons slot="start">
        <ion-button data-mupi-back (click)="goBack()">
          <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>{{ title() }}</ion-title>
      <span slot="end" class="mupihat-icon-container"><mupi-status></mupi-status></span>
    </ion-toolbar>
  }
</ion-header>

<ion-content class="medialist-content" [scrollY]="false">
  <div class="sa-page" data-mupi-page>
    <div class="sa-cover" [class.sa-round]="round()"><img [src]="cover()" alt="" /></div>
    <div class="sa-side">
      <div class="sa-name">
        <b>{{ title() }}</b>
        @if (sub()) {
          <small>{{ sub() }}</small>
        }
      </div>
      @if (choosing()) {
        <p class="sa-q">{{ texts.text('searchWhere') }}</p>
        @for (c of flow.categories(); track c) {
          <button class="sa-btn" type="button" [disabled]="busy()" (click)="addTo(c)">
            <ion-icon [name]="categoryLabel[c].icon"></ion-icon>{{ flow.catLabel(c) }}
          </button>
        }
      } @else {
        <!-- (podcasts, shows and a whole artist: on the start page only - their episodes / albums come with them there) -->
        @if (playable()) {
          <button class="sa-btn" type="button" [class.sa-off]="spotifyBlock.player()" (click)="play()"><span class="sa-ic">▶</span>{{ texts.text('searchPlay') }}</button>
        }
        @if (wish()) {
          <!-- (wished: the parents decide in the app; nothing played before) -->
          @if (wished()) {
            <button class="sa-btn sa-wished" type="button" disabled><span class="sa-ic">★</span>{{ texts.text('wishWished') }}</button>
          } @else {
            <button class="sa-btn sa-main sa-wish" type="button" (click)="toStart()"><span class="sa-ic">★</span>{{ texts.text('wishButton') }}</button>
          }
        } @else {
          <button class="sa-btn sa-main" type="button" (click)="toStart()"><span class="sa-ic">+</span>{{ texts.text('searchToStart') }}</button>
        }
      }
    </div>
  </div>
</ion-content>
