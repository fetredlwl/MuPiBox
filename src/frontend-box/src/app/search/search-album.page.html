<!-- (the header of the start page's album list: every theme draws it the same) -->
<ion-header class="medialist-header search-album-header" [class.km-r2]="r2()">
  @if (r2()) {
    <div class="km-bar">
      <button class="km-hbtn" type="button" data-mupi-back (click)="goBack()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
      </button>
      <div class="km-htitle"><span class="km-ht1">{{ heading() }}</span></div>
      <mupi-km-status-group></mupi-km-status-group>
    </div>
  } @else {
    <ion-toolbar color="light">
      <ion-buttons slot="start">
        <ion-button data-mupi-back (click)="goBack()">
          <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
      <ion-title>{{ heading() }}</ion-title>
      <span slot="end" class="mupihat-icon-container"><mupi-status></mupi-status></span>
    </ion-toolbar>
  }
</ion-header>

<!-- (the album list of the start page and of "Weiterhören": its cover, then what can be done with it as covers - the
     names on the theme's bars, read aloud on a tap) -->
<ion-content class="medialist-content">
  <mupi-swiper
    [data]="swiperData()"
    [compact]="headerHidden()"
    [roundImages]="round()"
    [positionKey]="listKey()"
    [attr.data-names]="swiperNames()"
    (elementClicked)="tileClicked($event.data)"
  ></mupi-swiper>
</ion-content>
